[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "logos-lang"
version = "0.1.0"
description = "Logos liturgical programming language runtime and tooling."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "lark>=1.1.0",
]

[project.scripts]
logos = "logos_lang.cli:main"

[project.optional-dependencies]
lsp = [
  "pygls>=2.0.0",
]
build = [
  "pyinstaller>=6.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.130.0",
  "mypy>=1.11.0",
  "mutmut>=3.3.1",
  "psutil>=7.0.0",
  # The LSP test suites import the legacy pygls server unconditionally.
  "pygls>=2.0.0",
  "pytest>=8.0.0",
  "ruff>=0.13.0",
]

[tool.hatch.build.targets.wheel]
# src layout: installs as `logos_lang`; the bundled canon (lib/*.lg) and py.typed ship as
# package data inside it, so nothing lands in site-packages under a generic name.
packages = ["src/logos_lang"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  ".specify",
  "packages/logos-vscode/server/bin",
  "packages/logos-vscode/server/build",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/logos_lang", "packages/logos-vscode/server/lsp_server.py"]
mypy_path = "src"
pretty = true
show_error_codes = true
warn_unused_configs = true

[tool.pyright]
# Used by the editor / Claude Code LSP for navigation; mypy (strict) is the authoritative checker.
venvPath = "."
venv = ".venv"
include = ["src", "packages/logos-vscode/server"]
pythonVersion = "3.12"

[tool.mutmut]
paths_to_mutate = ["src/logos_lang/"]
tests_dir = "tests/"
runner = "python -m pytest -q"
also_copy = ["tests/fixtures/"]

[tool.coverage.run]
source = ["logos_lang"]
branch = false
omit = ["*/logos_lang/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == .__main__.:"]
